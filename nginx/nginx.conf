upstream ros_mcp_backend {
    # MCP server backend
    server ros-mcp-server:9000;
    
    # Health check settings
    keepalive 32;
    keepalive_timeout 60s;
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=mcp_limit:10m rate=10r/s;

server {
    listen 80;
    server_name localhost;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Access and error logs
    access_log /var/log/nginx/ros-mcp-access.log;
    error_log /var/log/nginx/ros-mcp-error.log warn;
    
    # Client body size limit
    client_max_body_size 10M;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # MCP endpoint with rate limiting
    location /mcp {
        # Apply rate limiting
        limit_req zone=mcp_limit burst=20 nodelay;
        
        # Proxy settings
        proxy_pass http://ros_mcp_backend/mcp;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }
    
    # Root location
    location / {
        return 200 "ROS MCP Server Gateway\n";
        add_header Content-Type text/plain;
    }
}
